name: Publish vocabulary app

on:
  push:
    branches: [main, master]
    paths:
      - "vocab-app/**"
      - "resources/SAT_Reading_and_Writing_Vocabulary.md"
      - ".github/workflows/vocab-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vocab-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vocab-app/package-lock.json
      - name: Set site base path
        id: base
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi
      - name: Install and build
        working-directory: vocab-app
        env:
          VITE_BASE: ${{ steps.base.outputs.value }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: vocab-app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
